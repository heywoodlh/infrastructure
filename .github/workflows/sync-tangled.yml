name: sync-main-to-tangled

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-main-to-tangled
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.TANGLED_SSH_PRIVATE_KEY }}

      - name: Configure Tangled host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' 'tangled.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII2UShEm/FFPmYZUizaPnIqOJuynoCQpcLhl5PPHd02n' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Push main to Tangled
        run: |
          git remote add tangled git@tangled.org:heywoodlh.io/infrastructure
          git push tangled HEAD:refs/heads/main
